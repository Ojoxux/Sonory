# Test configuration - API and Web only for quick testing
services:
  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
      # テスト環境ではpython-apiの環境変数を削除する
      - NEXT_PUBLIC_PYTHON_API_URL=
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - web_next:/app/apps/web/.next
    depends_on: []
    networks:
      - sonory-network
    restart: unless-stopped

volumes:
  web_next:

networks:
  sonory-network:
    driver: bridge

# Secrets for testing
secrets:
  supabase_service_key:
    file: ./secrets/supabase_service_key.txt
  supabase_anon_key:
    file: ./secrets/supabase_anon_key.txt