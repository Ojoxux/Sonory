version: '3.8'

# Development overrides
services:
  web:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./apps/web:/app/apps/web:cached
      - ./packages:/app/packages:cached
      - web_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    command: sh -c "cd /app && npm install && npm run dev --prefix apps/web"

  api:
    build:
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/api:/app/apps/api:cached
      - ./packages:/app/packages:cached
      - api_node_modules:/app/node_modules
      - api_dist:/app/apps/api/dist
    command: sh -c "cd /app && npm install && npm run build --prefix apps/api && npm run dev:node --prefix apps/api"

  python-api:
    build:
      target: development
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - PYTHONPATH=/app
    volumes:
      - ./apps/python-audio-analyzer:/app:cached
      - python_venv:/app/.venv

volumes:
  web_node_modules:
  web_next:
  api_node_modules:
  api_dist:
  python_venv: