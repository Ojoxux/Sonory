# Sonory local dependency services
#
# 使い方:
#   docker compose up -d     — Python Audio Analyzer + Redis を起動
#
# 環境変数は.envファイルから自動読み込みされます
# .env.exampleを.envにコピーして設定してください

services:
  # Audio Analyzer (FastAPI + YAMNet)
  audio-analyzer:
    build:
      context: ./apps/python-audio-analyzer
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    env_file:
      - path: ./apps/python-audio-analyzer/.env
        required: false
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
    volumes:
      - tf_hub_cache:/app/tf_hub_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching
  redis:
    image: redis:7.2-alpine3.19
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
  tf_hub_cache:
