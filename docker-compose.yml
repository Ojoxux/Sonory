# Sonory 開発環境 Docker Compose
#
# 使い方:
#   docker compose up        — 開発環境起動（override.yml自動読み込み）
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up — 本番
#
# 環境変数は.envファイルから自動読み込みされます
# .env.exampleを.envにコピーして設定してください

services:
  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8787
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./apps/web:/app/apps/web:cached
      - ./packages:/app/packages:cached
      - /app/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      python-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Python Audio Analyzer (FastAPI)
  python-api:
    build:
      context: ./apps/python-audio-analyzer
      dockerfile: Dockerfile
      target: development
    expose:
      - "8000"
    env_file:
      - ./apps/python-audio-analyzer/.env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
    volumes:
      - ./apps/python-audio-analyzer/src:/app/src:cached
      - tf_hub_cache:/app/tf_hub_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching
  redis:
    image: redis:7.2-alpine3.19
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
  tf_hub_cache:
  web_next:
