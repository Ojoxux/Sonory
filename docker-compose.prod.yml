# 本番環境オーバーライド
#
# 使い方: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    build:
      target: production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes: []
    restart: always

  python-api:
    build:
      target: production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - tf_hub_cache:/app/tf_hub_cache
    restart: always
    ports: []

  redis:
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    ports: []
