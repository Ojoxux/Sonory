# Python Audio Analyzer production override
#
# 使い方: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  audio-analyzer:
    build:
      target: production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    restart: always

  redis:
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
