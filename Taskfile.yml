version: '3'

vars:
  COMPOSE_FILE: docker-compose.yml
  PROD_COMPOSE_FILE: docker-compose.prod.yml

tasks:
  sonory:up:
    desc: "全てのSonoryサービスを起動(Web + Python + API)"
    cmds:
      - 'echo "Sonory開発環境を起動しています..."'
      - docker compose up -d
      - 'echo "Web + Python Audio Analyzer起動完了"'
      - 'echo "APIサーバーを起動中..."'
      - task: sonory:status
      - 'echo ""'
      - 'echo "APIサーバーを起動します(Ctrl+Cで停止)"'
      - cd apps/api && npm run dev

  sonory:down:
    desc: "全てのSonoryサービスを停止(Docker + Wrangler)"
    cmds:
      - docker compose down
      - 'pkill -f "wrangler dev" || true'
      - 'echo "Sonoryサービスを停止しました"'

  sonory:dev:
    desc: "開発モードでサービスを起動(Docker フォアグラウンド + API)"
    cmds:
      - 'echo "Sonory開発環境を起動しています(フォアグラウンド)..."'
      - 'echo "Ctrl+Cで全サービスを停止できます"'
      - |
        trap 'docker compose down; exit' SIGINT SIGTERM
        docker compose up &
        cd apps/api && npm run dev

  sonory:prod:
    desc: "本番モードでサービスを起動"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.PROD_COMPOSE_FILE}} up -d
      - 'echo "APIはCloudflare Workersにデプロイしてください: task sonory:deploy:api"'

  sonory:deploy:
    desc: "全サービスをデプロイ(Web + Python + API)"
    cmds:
      - 'echo "Sonoryサービスをデプロイしています..."'
      - docker compose -f {{.COMPOSE_FILE}} -f {{.PROD_COMPOSE_FILE}} up -d --build
      - cd apps/api && npm run deploy:production
      - 'echo "全サービスのデプロイが完了しました"'

  sonory:deploy:staging:
    desc: "ステージング環境に全サービスをデプロイ"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.PROD_COMPOSE_FILE}} up -d --build
      - cd apps/api && npm run deploy:staging
      - 'echo "ステージング環境へのデプロイが完了しました"'

  sonory:deploy:api:
    desc: "APIのみをCloudflare Workersにデプロイ(本番環境)"
    cmds:
      - cd apps/api && npm run deploy:production

  sonory:deploy:api:staging:
    desc: "APIのみをCloudflare Workersにデプロイ(ステージング環境)"
    cmds:
      - cd apps/api && npm run deploy:staging

  sonory:rebuild:
    desc: "全サービスをリビルドして再起動"
    prompt: "全サービスを停止してリビルドします。実行してよろしいですか？"
    cmds:
      - docker compose down
      - docker compose build --no-cache
      - docker compose up -d
      - 'echo "リビルドして再起動しました"'

  sonory:logs:
    desc: "全サービスのログを表示"
    cmds:
      - docker compose logs -f

  sonory:logs:web:
    desc: "Webサービスのログのみ表示"
    cmds:
      - docker compose logs -f web

  sonory:logs:python:
    desc: "Python APIサービスのログのみ表示"
    cmds:
      - docker compose logs -f python-api

  sonory:status:
    desc: "全サービスのステータスを表示"
    cmds:
      - 'echo "Sonory サービス状態"'
      - 'echo "================================"'
      - docker compose ps
      - 'echo ""'
      - 'echo "Web (Next.js):          http://localhost:3000"'
      - 'echo "API (Wrangler):         http://localhost:8787"'
      - 'echo "Python Audio Analyzer:  内部ネットワーク(API経由)"'
      - 'echo "Redis:                  127.0.0.1:6379"'

  sonory:clean:
    desc: "コンテナ、ボリューム、イメージをクリーンアップ"
    prompt: "全てのコンテナとボリュームを削除します。実行してよろしいですか？"
    cmds:
      - docker compose down -v
      - docker system prune -f
      - 'echo "クリーンアップが完了しました"'

  sonory:shell:web:
    desc: "Webコンテナのシェルを開く"
    cmds:
      - docker compose exec web /bin/bash

  sonory:shell:python:
    desc: "Python APIコンテナのシェルを開く"
    cmds:
      - docker compose exec python-api /bin/bash

  # ==================== 個別サービス管理 ====================

  sonory:web:up:
    desc: "Webサービスを起動"
    cmds:
      - docker compose up -d web
      - 'echo "Web起動: http://localhost:3000"'

  sonory:web:down:
    desc: "Webサービスを停止"
    cmds:
      - docker compose stop web

  sonory:api:up:
    desc: "APIサービスを起動"
    dir: apps/api
    cmds:
      - npm run dev

  sonory:api:down:
    desc: "APIサービスを停止"
    cmds:
      - 'pkill -f "wrangler dev" || true'

  sonory:python:up:
    desc: "Python Audio Analyzerを起動"
    cmds:
      - docker compose up -d python-api

  sonory:python:down:
    desc: "Python Audio Analyzerを停止"
    cmds:
      - docker compose stop python-api

  # ==================== ショートカット ====================

  up:
    desc: "クイック起動(sonory:upのエイリアス)"
    cmds:
      - task: sonory:up

  down:
    desc: "クイック停止(sonory:downのエイリアス)"
    cmds:
      - task: sonory:down

  status:
    desc: "クイックステータス表示(sonory:statusのエイリアス)"
    cmds:
      - task: sonory:status

  # ==================== 開発ヘルパー ====================

  sonory:install:
    desc: "全サービスの依存関係をインストール"
    cmds:
      - 'echo "依存関係をインストール中..."'
      - docker compose run --rm web npm install
      - cd apps/api && npm install
      - docker compose run --rm python-api pip install -e .[dev]
      - 'echo "依存関係をインストールしました"'

  sonory:build:
    desc: "全サービスをビルド"
    cmds:
      - docker compose build
      - cd apps/api && npm run build
      - 'echo "ビルドが完了しました"'

  sonory:lint:
    desc: "全サービスのLintを実行"
    cmds:
      - docker compose run --rm web npm run lint
      - cd apps/api && npm run lint
      - docker compose run --rm python-api npm run lint
      - 'echo "Lintが完了しました"'

  sonory:type-check:
    desc: "全サービスの型チェックを実行"
    cmds:
      - docker compose run --rm web npm run type-check
      - cd apps/api && npm run type-check
      - docker compose run --rm python-api npm run lint:typecheck
      - 'echo "型チェックが完了しました"'
