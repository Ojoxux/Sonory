version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: 依存関係をインストールし、解析コンテナをビルドする
    cmds:
      - npm install
      - docker compose build audio-analyzer

  dev:
    desc: コンテナ・API・Web を起動する（Ctrl+C で API と Web が止まる）
    cmds:
      - task: infra
      - npx concurrently "npm run dev -w @sonory/api" "npm run dev -w @sonory/web" --names api,web --prefix-colors blue,green

  infra:
    desc: audio-analyzer と Redis のコンテナを起動する
    cmds:
      - docker compose up -d audio-analyzer redis

  api:
    desc: API だけ起動する（:8787）
    cmds:
      - npm run dev -w @sonory/api

  web:
    desc: Web だけ起動する（:3000）
    cmds:
      - npm run dev -w @sonory/web

  web:preview:
    desc: Workers ランタイムで Web を確認する
    cmds:
      - npm run preview -w @sonory/web

  down:
    desc: コンテナを停止する
    cmds:
      - docker compose down

  status:
    desc: コンテナの状態を表示する
    cmds:
      - docker compose ps

  logs:
    desc: "コンテナのログを追う（例: task logs -- audio-analyzer）"
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  rebuild:
    desc: 解析コンテナをキャッシュなしで作り直す
    cmds:
      - docker compose build --no-cache audio-analyzer
      - task: infra

  check:
    desc: 型チェック・lint・フォーマット・テストをすべて実行する
    cmds:
      - npx turbo type-check lint format test

  fix:
    desc: lint とフォーマットを自動修正する
    cmds:
      - npx turbo lint:fix format:fix

  build:
    desc: 全パッケージをビルドする
    cmds:
      - npx turbo build

  clean:
    desc: ビルド成果物と Sonory のコンテナ・ボリューム・イメージを削除する
    prompt: コンテナ・ボリューム・イメージを削除します。続けますか？
    cmds:
      - npx turbo clean
      - docker compose down -v --rmi local

  db:dump:
    desc: 実DBのスキーマを /tmp/sonory-schema-dump.sql にダンプする
    cmds:
      - |
        set -a; . apps/api/.env.db; set +a
        npx supabase db dump --db-url "$SUPABASE_DB_URL" -f /tmp/sonory-schema-dump.sql

  db:check:
    desc: migrations/ が schema.sql に記録されているか検証する
    cmds:
      - apps/api/supabase/tools/check_schema_sync.sh

  deploy:staging:
    desc: Web と API をステージングにデプロイする
    cmds:
      - npm run deploy:staging -w @sonory/web
      - npm run deploy:staging -w @sonory/api

  deploy:production:
    desc: Web と API を本番にデプロイする
    prompt: 本番にデプロイします。続けますか？
    cmds:
      - npm run deploy:production -w @sonory/web
      - npm run deploy:production -w @sonory/api
