version: '3.8'

# Docker Secrets configuration for sensitive data
# Use this with docker-compose.yml for secure secret management

secrets:
  supabase_service_key:
    file: ./secrets/supabase_service_key.txt
  supabase_anon_key:
    file: ./secrets/supabase_anon_key.txt

services:
  api:
    secrets:
      - supabase_service_key
      - supabase_anon_key
    environment:
      # Remove sensitive keys from environment variables
      # They will be available as files in /run/secrets/
      - SUPABASE_URL=${SUPABASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - PYTHON_AUDIO_ANALYZER_URL=${PYTHON_AUDIO_ANALYZER_URL:-http://python-api:8000}
      - PYTHON_AUDIO_ANALYZER_TIMEOUT=${PYTHON_AUDIO_ANALYZER_TIMEOUT:-30000}