name: DB Migrations CI

on:
   pull_request:
      branches: [main]
   workflow_dispatch:

jobs:
   check-applied:
      name: マイグレーションが実DBに適用済みか
      runs-on: ubuntu-latest
      steps:
         - name: リポジトリをチェックアウト
           uses: actions/checkout@v6

         # fork からの PR には secrets が渡らないため、その場合はスキップする
         - name: 適用状況を検証
           env:
              SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
           run: |
              if [ -z "$SUPABASE_DB_URL" ]; then
                 echo "SUPABASE_DB_URL が無いためスキップします"
                 exit 0
              fi
              apps/api/supabase/tools/check_migrations_applied.sh
