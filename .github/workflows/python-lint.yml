name: Python Lint CI

# トリガー条件: pushされたとき、またはpython-audio-analyzerディレクトリが変更されたとき
on:
   push:
     paths:
       - 'apps/python-audio-analyzer/**'
       - '.github/workflows/python-lint.yml'
   pull_request:
     paths:
       - 'apps/python-audio-analyzer/**'
       - '.github/workflows/python-lint.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: apps/python-audio-analyzer

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 2. Python をセットアップ
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'

      # 3. Python依存関係のキャッシュ
      - name: Cache Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. 依存パッケージのインストール
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # 5. Ruff Lint チェック
      - name: Run Ruff Lint
        run: python -m ruff check .

      # 6. Ruff Format チェック
      - name: Run Ruff Format Check
        run: python -m ruff format . --check

      # 7. MyPy 型チェック
      - name: Run MyPy Type Check
        run: python -m mypy .

      # 8. テスト実行
      - name: Run Tests
        run: python -m pytest

      # 9. Python OpenAPI Spec が最新であることを検証
      - name: Verify Python OpenAPI spec
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../../packages/shared-types/openapi/audio-analyzer.json

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    defaults:
      run:
        working-directory: apps/python-audio-analyzer

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 2. Docker Buildx セットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 3. Docker イメージビルド
      - name: Build Docker image
        run: docker build -t sonory-audio-analyzer . 
