[project]
name = "sonory-audio-analyzer"
version = "0.1.0"
description = "YAMNet-based audio analysis service for Sonory"
authors = [
    {name = "Sonory Team", email = "team@sonory.app"}
]
requires-python = ">=3.9"
dependencies = [
    "fastapi[all]>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "tensorflow>=2.21.0",
    "tensorflow-hub>=0.16.1",
    "setuptools<81",
    "numpy>=2.4.6",
    "librosa>=0.11.0",
    "soundfile>=0.14.0",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "redis>=7.4.1",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "ruff>=0.15.16",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py39"
