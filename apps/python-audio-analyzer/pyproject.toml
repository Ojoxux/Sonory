[project]
name = "sonory-audio-analyzer"
version = "0.1.0"
description = "YAMNet-based audio analysis service for Sonory"
authors = [
    {name = "Sonory Team", email = "team@sonory.app"}
]
requires-python = ">=3.9"
dependencies = [
    "fastapi[all]>=0.118.2",
    "uvicorn[standard]>=0.37.0",
    "tensorflow>=2.20.0",
    "tensorflow-hub>=0.16.1",
    "numpy>=2.3.3",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.12.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "redis>=5.3.1",
    "structlog>=23.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "black>=25.9.0",
    "isort>=6.1.0",
    "mypy>=1.18.2",
    "ruff>=0.14.0",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py39" 