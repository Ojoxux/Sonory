# ローカル開発用オーバーライド（docker compose up で自動読み込み）
#
# Wrangler dev をホストで実行する場合にpython-apiのポートを公開

services:
  web:
    build:
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8787
    volumes:
      - ./apps/web:/app/apps/web:cached
      - ./packages:/app/packages:cached
      - /app/node_modules
      - web_next:/app/apps/web/.next

  python-api:
    build:
      target: development
    env_file:
      - path: ./apps/python-audio-analyzer/.env
        required: false
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    volumes:
      - ./apps/python-audio-analyzer/src:/app/src:cached
      - tf_hub_cache:/app/tf_hub_cache
    ports:
      - "8000:8000"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  web_next:
